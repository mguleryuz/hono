<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Preload critical fonts with better caching -->
    <link
      rel="preload"
      href="/fonts/Archivo-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/PowerGrotesk-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />

    <!-- Preload app logo for instant display -->
    <link
      rel="preload"
      href="/images/icon.png"
      as="image"
      type="image/png"
      fetchpriority="high"
    />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />

    <!-- Open Graph tags -->
    <meta property="og:title" content="<og_title>" />
    <meta property="og:description" content="<og_description>" />
    <meta property="og:image" content="/static/og-image.png" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="<twitter_creator>" />
    <meta name="twitter:title" content="<twitter_title>" />
    <meta name="twitter:description" content="<twitter_description>" />
    <meta name="twitter:image" content="/static/og-image.png" />

    <!-- SEO Meta tags -->
    <meta name="description" content="<description>" />
    <meta name="keywords" content="<keyword1, keyword2>, keyword3>" />

    <title>title</title>

    <!-- Theme initialization script - prevents flash of unstyled content -->
    <script>
      ;(function () {
        const stored = localStorage.getItem('theme')
        const theme =
          stored && ['light', 'dark', 'system'].includes(stored)
            ? stored
            : 'system'
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)')
          .matches
          ? 'dark'
          : 'light'
        const resolved = theme === 'system' ? systemTheme : theme

        // Add no-transitions class to prevent initial transition flash
        document.documentElement.classList.add('no-transitions', resolved)

        // Font loading detection to prevent font flash
        function loadFonts() {
          if ('fonts' in document) {
            // Use Font Loading API if available
            const fonts = [
              new FontFace('Archivo', 'url(/fonts/Archivo-Regular.ttf)'),
              new FontFace(
                'PowerGrotesk',
                'url(/fonts/PowerGrotesk-Regular.ttf)'
              ),
            ]

            Promise.all(
              fonts.map((font) => {
                document.fonts.add(font)
                return font.load()
              })
            )
              .then(() => {
                document.documentElement.classList.add('fonts-loaded')
                document.documentElement.classList.remove('font-loading')
              })
              .catch(() => {
                // Fallback: show content after timeout even if fonts fail
                setTimeout(() => {
                  document.documentElement.classList.add('fonts-loaded')
                  document.documentElement.classList.remove('font-loading')
                }, 3000)
              })
          } else {
            // Fallback for browsers without Font Loading API
            setTimeout(() => {
              document.documentElement.classList.add('fonts-loaded')
              document.documentElement.classList.remove('font-loading')
            }, 100)
          }
        }

        // Start font loading
        document.documentElement.classList.add('font-loading')

        // Load fonts when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadFonts)
        } else {
          loadFonts()
        }

        // Remove no-transitions class after a brief delay
        setTimeout(() => {
          document.documentElement.classList.remove('no-transitions')
        }, 100)
      })()
    </script>

    <!-- Inline critical CSS for faster initial paint -->
    <style>
      /* Critical CSS - prevent layout shift and faster initial render */
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Prevent font flash by ensuring fonts are ready */
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }

      /* Hide content until fonts are loaded to prevent flash */
      .font-loading {
        visibility: hidden;
      }

      /* Show content when fonts are ready */
      .fonts-loaded {
        visibility: visible;
      }

      #app {
        min-height: 100vh;
      }

      /* Prevent CLS from sidebar - use CSS variable */
      [data-slot='sidebar-inner'] {
        transition: none;
      }

      /* Font-face definitions moved to global.css for better organization */
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
